# Deploys the React landing page (Frontend/) to GitHub Pages
# on every push to main. Site: https://elvadinho.github.io/SafeMe/
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['Frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# never run two deployments at the same time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci

      # BASE_PATH tells Vite the site lives in /SafeMe/ (see vite.config.ts)
      - run: npm run build
        env:
          BASE_PATH: /SafeMe/

      # GitHub Pages serves 404.html for unknown URLs like /SafeMe/demo,
      # so a copy of index.html lets React show the right page after a refresh
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
